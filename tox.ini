[tox]
isolated_build = True
envlist =
    py{35,36,37,38,312}
    py37-attrs{17,18,19,20,21}
    py312-attrs{17,18,19,20,21}
    py{37,312}-flake8
    coverage
    py{37,38,312}-mypy

[testenv]
package = wheel
deps =
    .[testing]
    .[sphinx]
    attrs17: attrs~=17.4
    attrs18: attrs~=18.2
    attrs19: attrs~=19.1
    attrs20: attrs~=20.3
    attrs21: attrs~=21.3
commands =
    pytest --cov=conformity --cov-report=term-missing --cov-fail-under=85

[testenv:py37-flake8]
skip_install = true
deps = flake8
commands = flake8

[testenv:coverage]
skip_install = true
deps = coverage
commands = coverage report -m

[testenv:py37-mypy]
commands = mypy .

[testenv:py38-mypy]
commands = mypy .

[testenv:py312-flake8]
skip_install = true
deps = flake8
commands = flake8

[testenv:py312-mypy]
commands = mypy .
